name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libcurl4-openssl-dev

      - name: Configure
        env:
          CC: ${{ matrix.compiler }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DREBELLION_WERROR=ON

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install + consume (pkg-config & find_package)
        run: |
          cmake --install build --prefix "$PWD/_prefix"
          export PKG_CONFIG_PATH="$PWD/_prefix/lib/pkgconfig"
          cat > /tmp/consume.c <<'EOF'
          #include <rebellion/rebellion.h>
          #include <stdio.h>
          int main(void){ rbl_client *c = rbl_client_new(NULL);
            printf("ok %s\n", RBL_VERSION_STRING); rbl_client_free(c); return 0; }
          EOF
          ${CC:-cc} /tmp/consume.c $(pkg-config --cflags --libs librebellion) -o /tmp/consume
          /tmp/consume
          cmake -S .github/consumer -B /tmp/fp -Drebellion_DIR="$PWD/_prefix/lib/cmake/rebellion"
          cmake --build /tmp/fp
          /tmp/fp/consumer

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: clang-format check
        run: |
          sudo apt-get update && sudo apt-get install -y clang-format
          clang-format --dry-run --Werror src/*.c src/*.h tests/*.c tests/*.h \
            fuzz/*.c examples/*.c

  fuzz-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libcurl4-openssl-dev clang libclang-rt-18-dev
      - name: Build + smoke-run fuzzers
        run: |
          cmake -S . -B build-fuzz -DREBELLION_FUZZ=ON \
            -DREBELLION_BUILD_TESTS=OFF -DREBELLION_BUILD_CLI=OFF \
            -DREBELLION_BUILD_SERVER=OFF \
            -DREBELLION_HARDEN=OFF -DCMAKE_C_COMPILER=clang \
            -DCMAKE_C_FLAGS="-fsanitize=fuzzer-no-link,address,undefined -g -O1"
          cmake --build build-fuzz -j
          for t in fuzz_html fuzz_json fuzz_robots; do
            ./build-fuzz/fuzz/$t -max_total_time=30 -print_final_stats=1
          done

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libcurl4-openssl-dev

      - name: Configure (ASan + UBSan)
        run: >
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1"

      - name: Build
        run: cmake --build build-asan -j

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-asan --output-on-failure
